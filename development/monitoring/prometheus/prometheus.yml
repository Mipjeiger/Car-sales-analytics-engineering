global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # FastAPI metrics
  - job_name: "fastapi"
    static_configs:
      - targets: ["fastapi:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # Docker/cAdvisor metrics
  - job_name: "docker"
    static_configs:
      - targets: ["cadvisor:8080"]
    scrape_interval: 15s

  # MLflow metrics
  - job_name: "mlflow"
    static_configs:
      - targets: ["mlflow:5000"]
    scrape_interval: 15s

  # PostgreSQL metrics
  - job_name: "postgresql"
    static_configs:
      - targets: ["postgres_exporter:9187"]
    scrape_interval: 15s