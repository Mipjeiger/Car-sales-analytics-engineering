name: PR Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest flake8 black
      
      - name: Lint
        run: |
          flake8 development/app/api/ --max-complexity=10
          black --check development/app/api/
      
      - name: Run tests
        run: |
          pytest tests/ -v
      
      - name: Check model files
        run: |
          ls -la development/models/