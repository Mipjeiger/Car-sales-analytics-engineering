name: "CD - Deploy"

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
      
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Build and push images
        run: |
          docker build -f development/docker/Dockerfile.fastapi -t ${{ secrets.DOCKER_USERNAME }}/car-api:latest development/
          docker build -f development/docker/Dockerfile.airflow -t ${{ secrets.DOCKER_USERNAME }}/car-airflow:latest development/
          docker push ${{ secrets.DOCKER_USERNAME }}/car-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/car-airflow:latest
      
      # Later i add server deployment if already have
      #- name: Deploy to server
      #  uses: appleboy/ssh-action@v1.0.3
      #  with:
      #    host: ${{ secrets.SERVER_HOST }}
      #    username: ${{ secrets.SERVER_USER }}
      #    key: ${{ secrets.SERVER_SSH_KEY }}
      #    script: |
      #      cd /opt/car_sales
      #      docker-compose pull
      #      docker-compose up -d --force-recreate
      #      docker system prune -f
      
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
