name: CI - Continuous Integration

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

# Grant write permissions to allow pushing auto-formatted code back to the repository
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref}}
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies & formatters
        run: |
          pip install -r development/docker/requirements-api.txt
          pip install pytest pytest-cov flake8 black autopep8 autoflake
      
      - name: Auto-fix formatting and unused imports
        run: |
          autoflake --remove-all-unused-imports --in-place -r development/
          autopep8 --in-place --recursive --max-line-length=100 development/
          black --line-length 100 development/
      
      - name: Commit & push auto-formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix formatting & lint issues [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Lint check with flake8
        run: |
          flake8 development/app/api --count --max-line-length=100 --max-complexity=12 --statistics
          flake8 development/orchestration/ --count --max-line-length=100 --max-complexity=12 --statistics

      - name: Run tests
        run: |
          pytest tests/ -v --cov=development/app/api --cov=development/orchestration --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false # Prevent failure if codecov token is unset or upload fails

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker images
        run: |
          docker-compose -f development/docker-compose.yml build